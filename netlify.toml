# Netlify deployment configuration — Phase 5
# Docs: https://docs.netlify.com/configure-builds/file-based-configuration/

[build]
  # Build command
  command = "npm run build"
  # Publish directory (Vite default)
  publish = "dist"
  # Node version
  environment = { NODE_VERSION = "20" }

# ── SPA Routing ───────────────────────────────────────────────────────────────
# React Router v6 — all paths must serve index.html on 404
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

# ── Cache Headers ─────────────────────────────────────────────────────────────
# Hashed chunks — immutable, cache for 1 year
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# Brotli / gzip pre-compressed assets
[[headers]]
  for = "/assets/*.br"
  [headers.values]
    Content-Encoding = "br"
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/assets/*.gz"
  [headers.values]
    Content-Encoding = "gzip"
    Cache-Control = "public, max-age=31536000, immutable"

# index.html — no cache (always fresh)
[[headers]]
  for = "/index.html"
  [headers.values]
    Cache-Control = "no-cache, no-store, must-revalidate"
    Pragma = "no-cache"
    Expires = "0"

# ── Security Headers ──────────────────────────────────────────────────────────
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=()"
    X-XSS-Protection = "1; mode=block"
